{% extends "base.html" %}
{% block title %}Log in · Homelab Hub{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  {% if setup_done %}<p class="notice">Admin created. Log in to continue.</p>{% endif %}
  {% if error %}<div class="errors">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="form">
    <label>Admin password
      <input type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <div class="buttons"><button type="submit">Log in</button></div>
  </form>
</section>
{% endblock %}
