# Paste into Dockge / Portainer, or save as docker-compose.yml (git-ignored) and run `docker compose up -d`.
# Edit the volume path first.
#
# First start: the temporary admin password is printed in the log:
#   docker logs homelab-hub      (or the Logs view in Dockge)
services:
  homelab-hub:
    image: ghcr.io/valerian-arch/android-homelab-hub:latest
    # To build from source instead, replace the line above with:  build: .
    container_name: homelab-hub
    restart: unless-stopped
    ports:
      - "8080:8080"   # Reach only from your LAN/VPN. Do NOT expose to the internet.
    environment:
      HUB_POLL_INTERVAL: "60"      # seconds between checks (minimum 10)
      HUB_SESSION_HOURS: "12"      # admin login lifetime
      HUB_SECURE_COOKIES: "false"  # set "true" once served over HTTPS
    volumes:
      # Persistent data: hub.db (encrypted credentials) + secret.key.
      # Create the host folder first, owned by the container's user (UID 10001):
      #   mkdir -p /path/to/configs/homelab-hub && chown 10001:10001 /path/to/configs/homelab-hub && chmod 700 /path/to/configs/homelab-hub
      # Back up BOTH files together. Without secret.key the saved credentials cannot be decrypted.
      - /path/to/configs/homelab-hub:/data
    # --- Hardening: the Hub needs no special privileges ---
    read_only: true                # container filesystem is read-only (only /data and /tmp are writable)
    tmpfs:
      - /tmp
    cap_drop:
      - ALL                        # no Linux capabilities needed (listens on 8080, not a privileged port)
    security_opt:
      - no-new-privileges:true     # nothing in the container can gain more privileges
    mem_limit: 512m
    pids_limit: 200
