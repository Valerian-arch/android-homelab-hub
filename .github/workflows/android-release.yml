# Builds the signed release APK of the Android app.
#
#   Push a version tag  ->  tests, signed APK, and a GitHub Release with the APK attached:
#       git tag v0.1.0 && git push origin v0.1.0
#   "Run workflow" button (Actions tab)  ->  same build, APK available as a downloadable artifact only.
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   the release keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          HUB_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          HUB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HUB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HUB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Remove signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Name the APK
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          APK="$RUNNER_TEMP/homelab-hub-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          (cd "$RUNNER_TEMP" && sha256sum "homelab-hub-$VERSION.apk" > "homelab-hub-$VERSION.apk.sha256")
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: homelab-hub-apk
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          generate_release_notes: true
