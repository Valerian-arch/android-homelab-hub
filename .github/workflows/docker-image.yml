# Builds the Hub's Docker image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:latest       (newest build from main)
#   ghcr.io/<owner>/<repo>:sha-<commit> (a specific build, for rolling back)
# The tests must pass before anything is published.
name: Hub image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish to ghcr.io using the built-in token (no personal token needed)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # lets one runner build for ARM (Raspberry Pi) too
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }} # lower-cased automatically
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
